name: smoke

# Проверка живого сайта на Vercel: коды ответа основных страниц.
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check pages
        env:
          SITE: https://aga-am.vercel.app
        run: |
          fail=0
          for path in / /up /login /register /film/1; do
            code=$(curl -s -o body.txt -w '%{http_code}' "$SITE$path")
            echo "== $path -> $code ($(wc -c < body.txt) bytes)"
            if [ "$code" -ge 500 ]; then
              fail=1
              head -c 500 body.txt; echo
            fi
          done
          # CSS/JS со главной: должны быть https и отдаваться с кодом 200.
          curl -s "$SITE/" -o home.html
          for url in $(grep -oE '(href|src)="[^"]*/build/[^"]+"' home.html | sed -E 's/^(href|src)="//; s/"$//' | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "== asset $url -> $code"
            case "$url" in https://*) ;; *) echo "   not https"; fail=1;; esac
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
